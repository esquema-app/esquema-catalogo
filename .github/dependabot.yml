# Dependabot: propone (nunca junta solo) actualizaciones de las actions de GitHub (fijadas por SHA), con 7 días de espera desde que
# sale una versión: si una action fue secuestrada, casi siempre se descubre y se retira en ese plazo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "Actions" }
